# █▀▀ ▀▄▀ █▀▀ █▀▀
# ██▄ █░█ ██▄ █▄▄
exec-once = wl-clipboard-history -t
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = dunst
exec-once = swayosd-server
exec-once = waybar

exec-once = hyprpaper
exec-once = hypridle

#exec-once = antimicrox
exec-once = sleep 3
#exec-once = antimicrox --profile ~/.config/antimicrox/generic.gamecontroller.amgp
# --eventgen uinput: don't let XDG_SESSION_TYPE pick XTest, which only reaches Xwayland (I37)
exec-once = antimicrox --hidden --eventgen uinput --profile ~/.config/antimicrox/generic.gamecontroller.amgp
# this is kind of brittle and might also not be needed since TVs generally only have 1 monitor
exec-once = xrandr --output $(hyprctl monitors -j | jq -r '.[0] | .name') --primary

# ssh
exec-once = ssh-agent -a $XDG_RUNTIME_DIR/ssh-agent.socket
exec-once = bash -c 'sleep 2 && ssh-add ~/.ssh/id_ed25519 ~/.ssh/gitdeploy 2>/dev/null'


